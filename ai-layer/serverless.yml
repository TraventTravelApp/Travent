service: trip-planner-ai

# Disable Serverless Dashboard (not needed for hackathon)
console: false

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    BEDROCK_MODEL_ID: anthropic.claude-sonnet-4-6-20260217-v1:0
    DYNAMODB_TABLE_NAME: trip-planner-trips
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: '*'
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:us-east-1:*:table/trip-planner-trips
functions:
  generateItinerary:
    handler: handlers/itinerary.generate
    timeout: 25
    events:
      - http:
          path: /ai/itinerary/generate
          method: post
          cors: true

