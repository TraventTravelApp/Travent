openapi: 3.0.3
info:
  title: C_O1 API
  description: |
    Internal API specification for the C_O1 mobile application.

    This is a starter spec — extend it as backend endpoints are implemented.
  version: 1.0.0
  contact:
    name: C_O1 Engineering

servers:
  - url: https://02qxzqxjjd.execute-api.us-east-1.amazonaws.com/dev
    description: Production (replace with actual API Gateway URL)
  - url: https://api-staging.example.com/v1
    description: Staging

tags:
  - name: Health
    description: Service health and readiness
  - name: Users
    description: User account operations

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service health status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Get current user
      description: Returns the authenticated user's profile.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
